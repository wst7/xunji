  <article>
    <h1>使用 pgvector 构建语义搜索</h1>
    <p>PostgreSQL 的 pgvector 扩展允许在数据库中存储向量并进行相似度查询。</p>
    <p>任务调度与向量检索可以结合：先把文档切分成块，再为每个块生成 embedding，检索时对查询向量取最近邻。</p>
    <p>全文检索和向量检索的混合方案能够同时利用词面与语义信号，效果优于单一通道。相关代码见 <a href="https://github.com/pgvector/pgvector">pgvector 仓库</a>。</p>
