name: Android APK

# 从 GitHub 上的代码直接构建可安装的 Android APK（arm64，release，JS 已打进包）。
# App 完全本地运行：不需要后端地址、账号或任何仓库变量。
# 产物在 Actions 运行页的 Artifacts 里；手机浏览器不方便下载时，可在电脑上下载后传到手机。
#
# 这里签的是 RN/Expo 模板自带的 debug 密钥，够个人安装使用；要上 Google Play
# 或用 EAS 正式签名，请走 apps/mobile 的 EAS 流程，不要用这份产物。

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      APP_VARIANT: production

    steps:
      - uses: actions/checkout@v4

      # 打 v* 标签时，把标签号作为 App 的 versionName 写进安装包（v0.3.1 → 0.3.1）。
      - name: 读取发布版本
        if: github.ref_type == 'tag'
        run: echo "XUNJI_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 不启用 Gradle 缓存：android/ 由 prebuild 生成，工作流开始时还没有
      # gradle-wrapper.properties，setup-java 的缓存查找会直接失败。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: npm ci

      # runner 自带 Android SDK；这里只接受许可，让 Gradle 需要时自行补装缺失的 platform。
      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 类型检查
        run: npm run mobile:typecheck

      - name: 生成原生工程
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: 构建 release APK
        working-directory: apps/mobile/android
        # 只打 arm64-v8a：覆盖绝大多数在售安卓机，构建更快、包更小。
        # 需要 32 位或模拟器时去掉这个参数（或改成 arm64-v8a,x86_64）。
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 重命名产物
        run: |
          src=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          out="xunji-${GITHUB_SHA::7}-arm64.apk"
          cp "$src" "$out"
          echo "APK: $out ($(du -h "$out" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: xunji-apk-${{ github.sha }}
          path: xunji-*-arm64.apk
          if-no-files-found: error
          retention-days: 30

      # 打 v* 标签时把 APK 发布到 Release，说明页的 releases/latest 入口才点得动。
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" xunji-*-arm64.apk --generate-notes
